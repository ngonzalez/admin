---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stream
  namespace: development
spec:
  # hostPort on a single node: the old pod must stop before the new one can start
  strategy:
    type: Recreate
  selector:
    matchLabels:
      run: app-stream
  template:
    metadata:
      labels:
        run: app-stream
    spec:
      containers:
      - name: app-stream
        image: registry.gitlab.com/ngonzalez121/demo-app-stream-org/app-stream
        env:
        - name: LOG_UDP_HOST
          value: "192.168.1.14"
        - name: LOG_UDP_PORT
          value: "1514"
        resources:
          # no CPU limit: CFS throttling adds latency to Ruby requests; the request
          # guarantees the share, and the node (20 CPUs) can absorb bursts
          requests:
            cpu: "1"
            memory: 1Gi
            ephemeral-storage: 2G
          limits:
            memory: 2Gi
            ephemeral-storage: 10G
        ports:
        - name: puma
          containerPort: 5000
          hostPort: 5000
        livenessProbe:
          httpGet:
            path: /_health
            port: 5000
          initialDelaySeconds: 3
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /_health
            port: 5000
          initialDelaySeconds: 3
          timeoutSeconds: 1
        volumeMounts:
        - name: ephemeral
          mountPath: /tmp
        - name: config
          mountPath: /etc/secrets/
          readOnly: true
      volumes:
      - name: config
        secret:
          secretName: app-stream-env
      - name: ephemeral
        emptyDir:
          sizeLimit: 2G
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
        searches:
          - link12.ddns.net
        options:
          - name: ndots
            value: "2"
          - name: eth0
