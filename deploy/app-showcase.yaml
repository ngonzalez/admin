---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-showcase
  namespace: development
spec:
  selector:
    matchLabels:
      run: app-showcase
  template:
    metadata:
      labels:
        run: app-showcase
    spec:
      containers:
      - name: app-showcase
        image: registry.gitlab.com/ngonzalez121/demo-app-showcase-org/app-showcase
        env:
        - name: LOG_UDP_HOST
          value: "192.168.1.14"
        - name: LOG_UDP_PORT
          value: "1514"
        resources:
          requests:
            ephemeral-storage: 5G
            memory: 5G
            cpu: 0.5
          limits:
            ephemeral-storage: 20G
            memory: 20G
            cpu: 4
        ports:
        - name: puma
          containerPort: 6000
          hostPort: 6000
        startupProbe:
          httpGet:
            path: /_health
            port: 6000
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /_health
            port: 6000
          initialDelaySeconds: 3
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /_health
            port: 6000
          initialDelaySeconds: 3
          timeoutSeconds: 1
        volumeMounts:
        - name: ephemeral
          mountPath: /tmp
        - name: config
          mountPath: /etc/secrets/
          readOnly: true
      volumes:
      - name: config
        secret:
          secretName: app-showcase-env
      - name: ephemeral
        emptyDir:
          sizeLimit: 2G
      # link12.ddns.net has no public DNS record when the No-IP hostname
      # lapses: resolve it to the node, like /etc/hosts on the server
      hostAliases:
      - ip: "192.168.1.14"
        hostnames:
        - link12.ddns.net
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
        searches:
          - link12.ddns.net
        options:
          - name: ndots
            value: "2"
          - name: eth0
