---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-frontend
  namespace: development
spec:
  selector:
    matchLabels:
      run: nginx-frontend
  template:
    metadata:
      labels:
        run: nginx-frontend
    spec:
      containers:
      - name: nginx-frontend
        image: registry.gitlab.com/ngonzalez121/demo-app-frontend-org/nginx-frontend
        resources:
          # no CPU limit, so TLS handshakes are never throttled
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        ports:
        - name: http
          containerPort: 80
        - name: https
          containerPort: 443
        - name: nginx-status
          containerPort: 2220
        # ready once nginx accepts TLS connections. An HTTP probe follows the
        # port 80 redirect to https://<pod IP>/, which nginx refuses: it only
        # answers requests for the site's name
        readinessProbe:
          tcpSocket:
            port: https
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: https
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: ephemeral
          mountPath: /tmp
        - name: tls
          mountPath: /etc/ssl/tls
          readOnly: true
        - name: site-tls
          mountPath: /etc/ssl/site
          readOnly: true
      volumes:
      - name: tls
        secret:
          secretName: link12-ddns-net-tls
          defaultMode: 0400
      # Cloudflare Origin certificate for appshare.site
      - name: site-tls
        secret:
          secretName: appshare-site-tls
          defaultMode: 0400
      - name: ephemeral
        emptyDir:
          sizeLimit: 2G
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
        searches:
          - link12.ddns.net
        options:
          - name: ndots
            value: "2"
          - name: eth0
