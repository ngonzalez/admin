---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: development
spec:
  selector:
    matchLabels:
      run: redis
  template:
    metadata:
      labels:
        run: redis
    spec:
      containers:
      - name: redis
        image: registry.gitlab.com/ngonzalez121/demo-app-database-org/redis
        envFrom:
          - secretRef:
              name: redis-env
        resources:
          # Guaranteed QoS; Redis runs commands on a single thread
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 1Gi
        ports:
        - name: redis
          containerPort: 6379
        readinessProbe:
          exec:
            command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
          initialDelaySeconds: 2
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
        searches:
          - link12.ddns.net
        options:
          - name: ndots
            value: "2"
          - name: eth0
