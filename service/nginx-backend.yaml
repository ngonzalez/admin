---
apiVersion: v1
kind: Service
metadata:
  name: nginx-backend-loadbalancer
  namespace: development
spec:
  type: LoadBalancer
  # keep the real client address: with Cluster, kube-proxy rewrites it to the
  # node's, so nginx and the apps logged every visitor as 192.168.1.14
  externalTrafficPolicy: Local
  selector:
    run: nginx-backend
  ports:
  - port: 4040
    name: nginx
    targetPort: 4040
  - port: 2222
    name: nginx-status
    targetPort: 2222
