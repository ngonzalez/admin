---
apiVersion: v1
kind: Service
metadata:
  name: nginx-stream-loadbalancer
  namespace: development
spec:
  type: LoadBalancer
  # keep the real client address: with Cluster, kube-proxy rewrites it to the
  # node's, so nginx and the apps logged every visitor as 192.168.1.14
  externalTrafficPolicy: Local
  selector:
    run: nginx-stream
  ports:
  - port: 5050
    name: https
    targetPort: 5050
  - port: 2221
    name: nginx-status
    targetPort: 2221
