---
apiVersion: v1
kind: Service
metadata:
  name: nginx-showcase-loadbalancer
  namespace: development
spec:
  type: LoadBalancer
  # keep the real client address: with Cluster, kube-proxy rewrites it to the
  # node's, so nginx and the apps logged every visitor as 192.168.1.14
  externalTrafficPolicy: Local
  selector:
    run: nginx-showcase
  ports:
  - port: 6060
    name: nginx
    targetPort: 6060
  - port: 2224
    name: nginx-status
    targetPort: 2224
