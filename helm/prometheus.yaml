---
# Overrides for the prometheus-community/prometheus chart (29.x).
# Only values that differ from the chart defaults belong here.
# Defaults: helm show values prometheus-community/prometheus

server:
  persistentVolume:
    enabled: false

  service:
    loadBalancerIP: "192.168.1.14"
    servicePort: 9090

scrapeConfigs:
  prometheus:
    static_configs:
      - targets:
          - 192.168.1.14:9090
  kubernetes-api-servers:
    job_name: kubernetes-apiservers
    tls_config:
      insecure_skip_verify: true
  nginx-backend:
    job_name: nginx backend
    static_configs:
      - targets:
          - 192.168.1.14:9111
  nginx-stream:
    job_name: nginx stream
    static_configs:
      - targets:
          - 192.168.1.14:9112
  nginx-frontend:
    job_name: nginx frontend
    static_configs:
      - targets:
          - 192.168.1.14:9113
  nginx-showcase:
    job_name: nginx showcase
    static_configs:
      - targets:
          - 192.168.1.14:9114
  postgresql:
    static_configs:
      - targets:
          - 192.168.1.14:9187
  redis:
    static_configs:
      - targets:
          - 192.168.1.14:9121
  node:
    static_configs:
      - targets:
          - 192.168.1.14:9100

# The cluster has no storage class, so run alertmanager on an emptyDir
alertmanager:
  persistence:
    enabled: false

# Alerting rules: firing alerts show in Prometheus (/alerts) and Alertmanager.
serverFiles:
  alerting_rules.yml:
    groups:
      - name: kubernetes
        rules:
          - alert: TargetDown
            expr: up == 0
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total{namespace="development"}[15m]) > 2
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.pod }} ({{ $labels.container }}) restarted {{ $value | humanize }} times in 15 minutes"
          - alert: ContainerWaiting
            expr: kube_pod_container_status_waiting_reason{namespace="development", reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError"} == 1
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.pod }} ({{ $labels.container }}) is stuck in {{ $labels.reason }}"
          - alert: PodNotReady
            expr: kube_pod_status_ready{namespace="development", condition="false"} == 1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.pod }} has not been ready for 10 minutes"
          - alert: DeploymentUnavailable
            expr: kube_deployment_status_replicas_unavailable{namespace="development"} > 0
            for: 10m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.deployment }} has {{ $value }} unavailable replica(s)"
          - alert: ContainerOOMKilled
            expr: >-
              kube_pod_container_status_last_terminated_reason{namespace="development", reason="OOMKilled"} == 1
              and on (namespace, pod, container) increase(kube_pod_container_status_restarts_total{namespace="development"}[15m]) > 0
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.pod }} ({{ $labels.container }}) was OOM-killed: raise its memory limit"
          - alert: ContainerMemoryNearLimit
            expr: >-
              max by (namespace, pod, container) (container_memory_working_set_bytes{namespace="development", container!=""})
              / max by (namespace, pod, container) (kube_pod_container_resource_limits{namespace="development", resource="memory"}) > 0.9
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.pod }} ({{ $labels.container }}) uses {{ $value | humanizePercentage }} of its memory limit"
      - name: services
        rules:
          - alert: NginxDown
            expr: nginx_up == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "nginx behind {{ $labels.job }} is not answering its status page"
          - alert: PostgresDown
            expr: pg_up == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "PostgreSQL is not answering the exporter"
          - alert: PostgresConnectionsHigh
            expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "PostgreSQL uses {{ $value | humanizePercentage }} of max_connections"
          - alert: RedisDown
            expr: redis_up == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "Redis is not answering the exporter"
          - alert: RedisMemoryNearMax
            expr: redis_memory_used_bytes / (redis_memory_max_bytes > 0) > 0.85
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Redis uses {{ $value | humanizePercentage }} of maxmemory: writes fail at the cap (noeviction)"
      - name: node
        rules:
          - alert: NodeDiskSpaceLow
            expr: node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} < 0.10
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "Only {{ $value | humanizePercentage }} disk space left on {{ $labels.instance }}"
          - alert: NodeMemoryLow
            expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "Only {{ $value | humanizePercentage }} memory available on {{ $labels.instance }}"
