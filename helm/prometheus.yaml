---
# Overrides for the prometheus-community/prometheus chart (29.x).
# Only values that differ from the chart defaults belong here.
# Defaults: helm show values prometheus-community/prometheus

server:
  persistentVolume:
    enabled: false

  service:
    loadBalancerIP: "192.168.1.14"
    servicePort: 9090

scrapeConfigs:
  prometheus:
    static_configs:
      - targets:
          - 192.168.1.14:9090
  kubernetes-api-servers:
    job_name: kubernetes-apiservers
    tls_config:
      insecure_skip_verify: true
  nginx-backend:
    job_name: nginx backend
    static_configs:
      - targets:
          - 192.168.1.14:9111
  nginx-stream:
    job_name: nginx stream
    static_configs:
      - targets:
          - 192.168.1.14:9112
  nginx-frontend:
    job_name: nginx frontend
    static_configs:
      - targets:
          - 192.168.1.14:9113
  postgresql:
    static_configs:
      - targets:
          - 192.168.1.14:9187
  redis:
    static_configs:
      - targets:
          - 192.168.1.14:9121
  node:
    static_configs:
      - targets:
          - 192.168.1.14:9100

# The cluster has no storage class, so run alertmanager on an emptyDir
alertmanager:
  persistence:
    enabled: false
