---
# Overrides for the grafana/loki chart (7.3.x): a single binary storing
# chunks on the host (/data/loki), so logs survive a cluster rebuild.
deploymentMode: SingleBinary

loki:
  # the chart's default tag lags behind its appVersion
  image:
    tag: 3.6.12
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 720h
  # a live tail (make logs without SINCE) ends after this: Loki's default
  # is 1h ("reached tail max duration limit")
  querier:
    tail_max_duration: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: manual
    size: 50Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# The gateway is the only way in from outside the cluster (externalIP, port
# 3100) and asks for a login. Alloy and Grafana use loki.development.svc:3100
# inside the cluster, without it. The htpasswd lives in the loki-gateway-auth
# secret (created outside git, from ~/.config/loki-credentials).
gateway:
  enabled: true
  replicas: 1
  basicAuth:
    enabled: true
    existingSecret: loki-gateway-auth
  service:
    port: 3100
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
# No ConfigMap carries the loki_rule label: the rules sidecar only used memory
sidecar:
  rules:
    enabled: false
